# AeroSem-ZMRF ablation: semantic core + ZMRF, without MPD.
# Compatibility mapping: the paper's ZMRF is implemented by MCFGatedFusion.

nc: 4
text_encoder:
  name: mobileclip_s0
  dim: 512

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 - stem
  - [-1, 1, Conv, [128, 3, 2]]             # 1
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]             # 5
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]            # 7
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

text:
  - [-1, 1, VCTETextInput, [], "text"]       # 11 - text input socket
  - [11, 1, VCTETextAdapter, []]             # 12 - text adapter
  - [10, 1, VCTEVisualAdapter, []]           # 13 - visual context from backbone
  - [[12, 13], 1, VCTETextEnhancer, []]      # 14 - text-visual fusion

head:
  # MCF-gated neck: Concat replaced by MCFGatedFusion('add', k=3)
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 6], 1, MCFGatedFusion, ['add', 3]]         # 16 - gated(P5_up, P4)
  - [-1, 2, C3k2, [512, False]]                       # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 18
  - [[-1, 4], 1, MCFGatedFusion, ['add', 3]]          # 19 - gated(P4_up, P3)
  - [-1, 2, C3k2, [256, False]]                       # 20 - P3/8-small (MCF-gated)
  - [-1, 1, Conv, [256, 3, 2]]                        # 21
  - [[-1, 17], 1, MCFGatedFusion, ['add', 3]]         # 22 - gated(P3_down, P4)
  - [-1, 2, C3k2, [512, False]]                       # 23 - P4/16-medium (MCF-gated)
  - [-1, 1, Conv, [512, 3, 2]]                        # 24
  - [[-1, 10], 1, MCFGatedFusion, ['add', 3]]         # 25 - gated(P4_down, P5)
  - [-1, 2, C3k2, [1024, True]]                       # 26 - P5/32-large (MCF-gated)
  - [[20, 14], 1, VCTENeckModulator, []]              # 27 - enhanced P3
  - [[23, 14], 1, VCTENeckModulator, []]              # 28 - enhanced P4
  - [[26, 14], 1, VCTENeckModulator, []]              # 29 - enhanced P5
  - [[27, 28, 29, 14], 1, YOLOVODetect, []]           # 30 - open-vocab detection head
