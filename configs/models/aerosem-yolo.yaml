# AeroSem-YOLO
# Paper naming:
#   DRFD -> MPD: Multi-Path Detail-Preserving Downsampler
#   MCFGatedFusion -> ZMRF: Zero-Initialized Multi-Scale Residual Fusion
# Final configuration:
#   YOLOVO11n semantic core + MPD backbone + ZMRF neck
# Note: code class names remain unchanged for compatibility.

nc: 4

text_encoder:
  name: mobileclip_s0
  dim: 512

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                   # 0  P1/2 stem
  - [-1, 1, DRFD, [128]]                        # 1  MPD / P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]           # 2
  - [-1, 1, DRFD, [256]]                        # 3  MPD / P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]           # 4  P3 feature
  - [-1, 1, DRFD, [512]]                        # 5  MPD / P4/16
  - [-1, 2, C3k2, [512, True]]                  # 6  P4 feature
  - [-1, 1, DRFD, [1024]]                       # 7  MPD / P5/32
  - [-1, 2, C3k2, [1024, True]]                 # 8
  - [-1, 1, SPPF, [1024, 5]]                    # 9
  - [-1, 2, C2PSA, [1024]]                      # 10 final backbone feature

text:
  - [-1, 1, VCTETextInput, [], "text"]          # 11 category prompt input
  - [11, 1, VCTETextAdapter, []]                # 12 text prototype adapter
  - [10, 1, VCTEVisualAdapter, []]              # 13 global visual context encoder
  - [[12, 13], 1, VCTETextEnhancer, []]         # 14 context-aware prototype refinement

head:
  # Top-down ZMRF path
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 6], 1, MCFGatedFusion, ["add", 3]]    # 16 ZMRF(P5_up, P4)
  - [-1, 2, C3k2, [512, False]]                 # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 4], 1, MCFGatedFusion, ["add", 3]]    # 19 ZMRF(P4_up, P3)
  - [-1, 2, C3k2, [256, False]]                 # 20 P3/8-small

  # Bottom-up ZMRF path
  - [-1, 1, Conv, [256, 3, 2]]                  # 21
  - [[-1, 17], 1, MCFGatedFusion, ["add", 3]]   # 22 ZMRF(P3_down, P4)
  - [-1, 2, C3k2, [512, False]]                 # 23 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                  # 24
  - [[-1, 10], 1, MCFGatedFusion, ["add", 3]]   # 25 ZMRF(P4_down, P5)
  - [-1, 2, C3k2, [1024, True]]                 # 26 P5/32-large

  # Hierarchical semantic modulation and region-text alignment
  - [[20, 14], 1, VCTENeckModulator, []]        # 27 HSM-enhanced P3
  - [[23, 14], 1, VCTENeckModulator, []]        # 28 HSM-enhanced P4
  - [[26, 14], 1, VCTENeckModulator, []]        # 29 HSM-enhanced P5
  - [[27, 28, 29, 14], 1, YOLOVODetect, []]     # 30 RTAH
